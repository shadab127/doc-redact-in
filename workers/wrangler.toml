# Cloudflare Workers config for docredact.in form endpoints.
# Deploy with: cd workers && npx wrangler deploy --name docredact-waitlist --main waitlist.ts
#           or: npx wrangler deploy --name docredact-contact --main contact.ts

name = "docredact-forms"
main = "waitlist.ts"
compatibility_date = "2026-05-01"

# Route the waitlist and contact Workers behind the same custom domain once it
# is registered. Example (post-launch, after docredact.in is live on Pages):
#
# [[env.production.routes]]
# pattern = "docredact.in/api/waitlist"
# zone_name = "docredact.in"
#
# [[env.production.routes]]
# pattern = "docredact.in/api/contact"
# zone_name = "docredact.in"

[[kv_namespaces]]
binding = "WAITLIST_KV"
id = "PLACEHOLDER_CREATE_WITH_WRANGLER_KV_NAMESPACE_CREATE"

[vars]
NOTIFICATION_EMAIL = "hello@docredact.in"
ALLOWED_ORIGINS = "https://docredact.in,https://www.docredact.in"
# Secrets (RESEND_API_KEY) are set via: wrangler secret put RESEND_API_KEY
