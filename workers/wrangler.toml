# Cloudflare Worker config for the B2B API waitlist endpoint.
# Deploy with: cd workers && npx wrangler deploy

name = "docredact-waitlist"
main = "waitlist.ts"
compatibility_date = "2026-05-01"

[[kv_namespaces]]
binding = "WAITLIST_KV"
id = "0582b77c41a448d684f2475c53abf5bd"

[vars]
NOTIFICATION_EMAIL = "hello@docredact.in"
ALLOWED_ORIGINS = "https://docredact.in,https://www.docredact.in"
