<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- Synthetic Aadhaar-like card — FAKE data, no real PII -->
  <rect width="640" height="400" fill="#f5f5f0"/>

  <!-- Card body -->
  <rect x="40" y="40" width="560" height="320" rx="16" ry="16" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>

  <!-- Header band -->
  <rect x="40" y="40" width="560" height="56" rx="16" ry="16" fill="#1a6ed8"/>
  <rect x="40" y="80" width="560" height="16" fill="#1a6ed8"/>
  <text x="72" y="76" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff">Government of India — SAMPLE (FAKE)</text>

  <!-- Face silhouette -->
  <circle cx="120" cy="220" r="55" fill="#e0e0e0"/>
  <circle cx="120" cy="200" r="30" fill="#bdbdbd"/>
  <ellipse cx="120" cy="265" rx="42" ry="22" fill="#bdbdbd"/>

  <!-- Labels and fake data -->
  <text x="220" y="140" font-family="sans-serif" font-size="14" fill="#888888">Name</text>
  <text x="220" y="162" font-family="sans-serif" font-size="18" font-weight="600" fill="#222222">Sample User</text>

  <text x="220" y="192" font-family="sans-serif" font-size="14" fill="#888888">Date of Birth</text>
  <text x="220" y="214" font-family="sans-serif" font-size="18" font-weight="600" fill="#222222">01/01/1990</text>

  <text x="220" y="244" font-family="sans-serif" font-size="14" fill="#888888">Gender</text>
  <text x="220" y="266" font-family="sans-serif" font-size="18" font-weight="600" fill="#222222">Male</text>

  <!-- Aadhaar number (fake, passes Verhoeff for demo) -->
  <text x="220" y="310" font-family="sans-serif" font-size="14" fill="#888888">Aadhaar Number (FAKE)</text>
  <text x="220" y="338" font-family="monospace" font-size="26" font-weight="700" fill="#333333" letter-spacing="4">1234 5678 9012</text>

  <!-- QR placeholder -->
  <rect x="490" y="170" width="88" height="88" rx="6" fill="#eeeeee" stroke="#cccccc" stroke-width="1"/>
  <rect x="498" y="178" width="24" height="24" rx="2" fill="#333"/>
  <rect x="554" y="178" width="24" height="24" rx="2" fill="#333"/>
  <rect x="498" y="234" width="24" height="24" rx="2" fill="#333"/>
  <rect x="530" y="178" width="10" height="10" fill="#333"/>
  <rect x="530" y="198" width="10" height="10" fill="#333"/>
  <rect x="554" y="204" width="10" height="10" fill="#333"/>
  <rect x="554" y="218" width="10" height="10" fill="#333"/>

  <!-- Footer note -->
  <text x="40" y="385" font-family="sans-serif" font-size="11" fill="#999999">SYNTHETIC SAMPLE — No real Aadhaar data. For testing DocRedact.in only.</text>
</svg>
